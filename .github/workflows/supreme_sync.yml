name: Update Supreme Values in database.lua

on:
  schedule:
    - cron: '0 */6 * * *' # Автозапуск каждые 6 часов
  workflow_dispatch: # Возможность запустить вручную кнопкой в GitHub

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v3

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка Playwright и браузера Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Парсинг Supreme Values и замена цен
        run: python update_prices.py

      - name: Сохранение и пуш изменений в GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.lua
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prices in database.lua from Supreme Values" && git push)
